name: keep-warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Flask /health (keeps App Service F1 warm)
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 \
            https://web-rag-rl01.azurewebsites.net/health || true
