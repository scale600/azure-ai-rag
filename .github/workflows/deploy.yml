# CI/CD deploy. Requires repo secrets:
#   api job: AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID (OIDC federation)
#   ui  job: AZURE_STATIC_WEB_APPS_API_TOKEN (SWA deployment token)
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pre-install deps + bundle zip (no on-host build)
        run: |
          pip install --target deps/ -r api/requirements.txt
          mkdir -p pkg/data
          cp api/app.py api/rag.py api/ingest.py api/requirements.txt pkg/
          cp -r data/* pkg/data/
          mv deps pkg/deps
          (cd pkg && zip -qr ../app.zip .)

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Flask API (config-zip, extract only)
        run: az webapp deployment source config-zip -g ai-rag-prototype -n web-rag-rl01 --src app.zip

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy chat UI to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ui/
